name: UPSC Complete Scraper

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:

  scrape:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Setup Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------
      # Run scraper
      # ------------------------------------------------------

      - name: Run complete UPSC crawler
        run: |
          python scraper.py

      # ------------------------------------------------------
      # Validate JSON
      # ------------------------------------------------------

      - name: Validate output
        run: |
          python -c "import json; d=json.load(open('data.json', encoding='utf-8')); print('JSON OK'); print('Pages:', d.get('total_pages')); print('Successful:', d.get('successful_pages')); print('Failed:', d.get('failed_pages')); print('Documents:', d.get('total_documents'))"

      # ------------------------------------------------------
      # Save data to repository
      # ------------------------------------------------------

      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          git diff --cached --quiet || git commit -m "Update UPSC data"

          git push
