name: UPSC Complete Scraper

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:

  scrape:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run UPSC scraper
        run: |
          python scraper.py

      - name: Validate generated files
        run: |
          python - <<'PY'
          import json
          import os

          required = [
              "data/index.json",
              "data/jobs.json",
              "data/results.json",
              "data/admit_cards.json",
              "data/answer_keys.json",
              "data/question_papers.json",
              "data/exams.json",
              "data/cut_offs.json",
              "data/marks.json",
              "data/syllabus.json",
              "data/calendars.json",
              "data/exam_notifications.json",
              "data/interviews.json",
              "data/notices.json",
              "data/documents.json",
              "data/other.json",
          ]

          for file in required:

              if not os.path.exists(file):
                  raise SystemExit(
                      f"Missing file: {file}"
                  )

              with open(
                  file,
                  encoding="utf-8"
              ) as f:
                  json.load(f)

              print(
                  f"OK: {file}"
              )

          print("ALL JSON FILES VALID")
          PY

      - name: Remove old huge data.json
        run: |
          rm -f data.json

      - name: Save scraper data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update UPSC data"
            git push
          fi
